<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>실시간 경고 알림</title>

  <link
          rel="stylesheet"
          href="/style.css">

  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>


<div id="header-container"></div>


<main class="page page-small">


  <h1 class="page-title">
    실시간 경고 알림
  </h1>


  <p class="page-description">
    미등록 차량이 감지되면 실시간으로 경고를 표시합니다.
  </p>


  <section class="card">


    <div class="status-bar">

      <span class="status-dot"></span>

      실시간 감지 시스템 연결 중

    </div>


    <ul
            id="log"
            class="data-list">


      <li class="empty">

        <i class="bi bi-bell"></i>

        새로운 미등록 차량을 기다리고 있습니다.

      </li>


    </ul>


  </section>


  <div class="button-area">


    <button
            class="back-btn"
            onclick="location.href='/dashboard.html'">

      <i class="bi bi-arrow-left"></i>

      대시보드로

    </button>


  </div>


</main>


<script src="/common.js"></script>


<script>

  const token =
          localStorage.getItem("token");


  if (!token) {

    alert(
            "인증되지 않았습니다. 로그인 페이지로 이동합니다."
    );

    location.href =
            "/login.html";

  }


  const eventSource =
          new EventSource(
                  "/api/warning/stream"
          );


  const log =
          document.getElementById("log");


  eventSource.addEventListener(
          "warning",

          function(event) {


            const empty =
                    log.querySelector(".empty");


            if (empty) {

              log.innerHTML = "";

            }


            const li =
                    document.createElement("li");


            li.className =
                    "warning-item";


            li.innerHTML = `

                <div class="warning-number">

                    <i class="bi bi-exclamation-triangle-fill"></i>

                    미등록 차량 감지

                </div>


                <div class="warning-detail">

                    ${event.data}

                </div>

            `;


            log.prepend(li);

          }
  );


  eventSource.onerror =
          function() {


            const li =
                    document.createElement("li");


            li.className =
                    "warning-item";


            li.innerHTML = `

                <div class="warning-number">

                    <i class="bi bi-wifi-off"></i>

                    연결 종료

                </div>


                <div class="warning-detail">

                    실시간 서버 연결이 종료되었습니다.

                </div>

            `;


            log.prepend(li);

          };

</script>


</body>

</html>
