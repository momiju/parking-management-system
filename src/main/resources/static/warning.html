<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>미등록 차량 조회</title>

    <link
            rel="stylesheet"
            href="/style.css">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>


<div id="header-container"></div>


<main class="page">


    <h1 class="page-title">
        미등록 차량 조회
    </h1>


    <p class="page-description">
        감지된 미등록 차량을 차량번호, 위치, 날짜로 조회합니다.
    </p>


    <section class="card">


        <h2 class="card-title">
            검색 조건
        </h2>


        <form id="filterForm">


            <div class="form-row">


                <div class="form-group">

                    <label class="form-label">
                        차량번호
                    </label>

                    <input
                            type="text"
                            id="plateNumber"
                            class="form-input"
                            placeholder="예: 137하7288">

                </div>


                <div class="form-group">

                    <label class="form-label">
                        위치
                    </label>

                    <input
                            type="text"
                            id="location"
                            class="form-input"
                            placeholder="예: A동 정문">

                </div>


                <div class="form-group">

                    <label class="form-label">
                        날짜
                    </label>

                    <input
                            type="date"
                            id="date"
                            class="form-input">

                </div>


            </div>


            <button
                    type="submit"
                    class="primary-btn">

                <i class="bi bi-search"></i>

                검색

            </button>


        </form>


    </section>


    <section class="card">


        <h2 class="card-title">
            미등록 차량 감지 기록
        </h2>


        <ul
                id="warningList"
                class="data-list">
        </ul>


    </section>


    <div class="button-area">


        <button
                class="back-btn"
                onclick="location.href='/dashboard.html'">

            <i class="bi bi-arrow-left"></i>

            대시보드로

        </button>


    </div>


</main>


<script src="/common.js"></script>


<script>

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert(
            "인증되지 않았습니다. 로그인 페이지로 이동합니다."
        );

        location.href =
            "/login.html";

    }


    const form =
        document.getElementById("filterForm");


    const list =
        document.getElementById("warningList");


    form.onsubmit = async (e) => {


        e.preventDefault();


        const plate =
            document
                .getElementById("plateNumber")
                .value
                .trim();


        const locationVal =
            document
                .getElementById("location")
                .value
                .trim();


        const date =
            document
                .getElementById("date")
                .value;


        const params =
            new URLSearchParams();


        if (plate) {

            params.append(
                "plateNumber",
                plate
            );

        }


        if (locationVal) {

            params.append(
                "location",
                locationVal
            );

        }


        if (date) {

            params.append(
                "date",
                date
            );

        }


        const response =
            await fetch(
                "/api/warning/filter?"
                + params.toString(),
                {

                    headers: {

                        "Authorization":
                            `Bearer ${token}`

                    }

                }
            );


        if (!response.ok) {

            alert(
                "인증 실패 또는 오류가 발생했습니다."
            );

            return;
        }


        const data =
            await response.json();


        list.innerHTML = "";


        if (data.length === 0) {

            list.innerHTML = `

                <li class="empty">

                    <i class="bi bi-shield-check"></i>

                    조회된 미등록 차량이 없습니다.

                </li>

            `;

            return;
        }


        data.forEach(w => {


            const li =
                document.createElement("li");


            li.className =
                "warning-item";


            li.innerHTML = `

                <div class="warning-number">

                    <i class="bi bi-exclamation-triangle-fill"></i>

                    ${w.plateNumber}

                </div>


                <div class="warning-detail">

                    <i class="bi bi-geo-alt"></i>

                    ${w.location || "위치 정보 없음"}

                    &nbsp; · &nbsp;

                    <i class="bi bi-clock"></i>

                    ${w.timestamp || "시간 정보 없음"}

                </div>

            `;


            list.appendChild(li);


        });

    };


    form.dispatchEvent(
        new Event("submit")
    );

</script>


</body>

</html>
