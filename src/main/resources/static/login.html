<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>관리자 로그인</title>

  <link rel="stylesheet" href="/style.css">
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
</head>

<body>
<div class="login-page">
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="login-logo-icon">
        <i class="bi bi-p-square"></i>
      </div>

      <h1>주차 관리 시스템</h1>
      <p>관리자 계정으로 로그인해주세요.</p>
    </div>

    <div class="login-card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">아이디</label>
          <input
                  type="text"
                  id="username"
                  class="form-input"
                  value="admin"
                  placeholder="아이디를 입력하세요"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">비밀번호</label>
          <input
                  type="password"
                  id="password"
                  class="form-input"
                  value="1234"
                  placeholder="비밀번호를 입력하세요"
          >
        </div>

        <button type="submit" class="primary-btn full-btn">
          로그인
        </button>
      </form>

      <p id="message"></p>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById("loginForm");
  const msg = document.getElementById("message");

  form.onsubmit = async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username) {
      msg.style.color = "#c95b5b";
      msg.textContent = "아이디를 입력해주세요.";
      return;
    }

    if (!password) {
      msg.style.color = "#c95b5b";
      msg.textContent = "비밀번호를 입력해주세요.";
      return;
    }

    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password
      })
    });

    if (response.ok) {
      const token = await response.text();

      localStorage.setItem("token", token);

      msg.style.color = "#3f8a68";
      msg.textContent = "로그인 완료되었습니다.";

      location.href = "/dashboard.html";
    } else {
      msg.style.color = "#c95b5b";
      msg.textContent = "아이디 또는 비밀번호가 잘못되었습니다.";
    }
  };
</script>
</body>
</html>
