<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>관리자 대시보드</title>

  <link rel="stylesheet" href="/style.css">
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
</head>

<body>
<div id="header-container"></div>

<main class="page">
  <div class="dashboard-header">
    <h1 class="dashboard-title">관리자 대시보드</h1>

    <p class="dashboard-description">
      주차장의 차량 등록 및 출입 현황을 관리합니다.
    </p>
  </div>

  <div class="dashboard-grid">
    <div
            class="dashboard-card"
            onclick="location.href='/vehicles.html'"
    >
      <div class="dashboard-card-icon icon-blue">
        <i class="bi bi-car-front"></i>
      </div>

      <div class="dashboard-card-content">
        <h2>등록 차량 관리</h2>
        <p>
          등록된 차량을 확인하고 새로운 차량을 등록하거나 삭제합니다.
        </p>
      </div>

      <div class="dashboard-card-arrow">
        <i class="bi bi-arrow-right"></i>
      </div>
    </div>

    <div
            class="dashboard-card"
            onclick="location.href='/history.html'"
    >
      <div class="dashboard-card-icon icon-green">
        <i class="bi bi-clock-history"></i>
      </div>

      <div class="dashboard-card-content">
        <h2>차량 출입 기록</h2>
        <p>
          차량의 출입 위치와 최근 출입 시간을 확인합니다.
        </p>
      </div>

      <div class="dashboard-card-arrow">
        <i class="bi bi-arrow-right"></i>
      </div>
    </div>

    <div
            class="dashboard-card"
            onclick="location.href='/warning.html'"
    >
      <div class="dashboard-card-icon icon-orange">
        <i class="bi bi-exclamation-triangle"></i>
      </div>

      <div class="dashboard-card-content">
        <h2>미등록 차량 조회</h2>
        <p>
          감지된 미등록 차량을 차량번호, 위치, 날짜로 조회합니다.
        </p>
      </div>

      <div class="dashboard-card-arrow">
        <i class="bi bi-arrow-right"></i>
      </div>
    </div>
  </div>
</main>

<script src="/common.js"></script>

<script>
  const token = localStorage.getItem("token");

  if (!token) {
    alert("인증되지 않았습니다. 로그인 페이지로 이동합니다.");
    location.href = "/login.html";
  }
</script>
</body>
</html>
