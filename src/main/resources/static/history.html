<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>차량 출입 기록</title>

  <link
          rel="stylesheet"
          href="/style.css">

  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>


<div id="header-container"></div>


<main class="page page-small">


  <h1 class="page-title">
    차량 출입 기록
  </h1>


  <p class="page-description">
    주차장을 출입한 전체 차량의 기록을 확인합니다.
  </p>


  <section class="card">


    <h2 class="card-title">
      전체 출입 차량
    </h2>


    <ul
            id="historyList"
            class="data-list">
    </ul>


  </section>


  <div class="button-area">


    <button
            class="back-btn"
            onclick="location.href='/dashboard.html'">

      <i class="bi bi-arrow-left"></i>

      대시보드로

    </button>


  </div>


</main>


<script src="/common.js"></script>


<script>

  const token =
          localStorage.getItem("token");


  if (!token) {

    alert(
            "인증되지 않았습니다. 로그인 페이지로 이동합니다."
    );

    location.href =
            "/login.html";

  }


  const list =
          document.getElementById("historyList");


  async function loadHistory() {


    const response =
            await fetch(
                    "/api/vehicle/history",
                    {

                      headers: {

                        "Authorization":
                                `Bearer ${token}`

                      }

                    }
            );


    if (!response.ok) {

      alert(
              "인증 오류 또는 데이터를 불러오지 못했습니다."
      );

      return;
    }


    const data =
            await response.json();


    list.innerHTML = "";


    if (data.length === 0) {

      list.innerHTML = `

                <li class="empty">

                    <i class="bi bi-clock-history"></i>

                    출입 기록이 없습니다.

                </li>

            `;

      return;
    }


    data.forEach(v => {


      const li =
              document.createElement("li");


      li.className =
              "data-item";


      const time =
              v.lastSeen
                      ? v.lastSeen.replace("T", " ")
                      : "시간 정보 없음";


      li.innerHTML = `

                <div class="vehicle-info">

                    <div class="vehicle-icon">

                        <i class="bi bi-car-front"></i>

                    </div>


                    <div>

                        <div class="vehicle-number">

                            ${v.plateNumber}

                        </div>


                        <div class="vehicle-sub">

                            <i class="bi bi-geo-alt"></i>

                            ${v.location || "위치 정보 없음"}

                            &nbsp; · &nbsp;

                            <i class="bi bi-clock"></i>

                            ${time}

                        </div>

                    </div>

                </div>

            `;


      list.appendChild(li);


    });

  }


  loadHistory();

</script>


</body>

</html>
