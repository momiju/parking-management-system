<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>등록 차량 관리</title>

  <link rel="stylesheet" href="/style.css">
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
</head>

<body>
<div id="header-container"></div>

<main class="page page-small">
  <h1 class="page-title">등록 차량 관리</h1>

  <p class="page-description">
    주차장 출입이 허용된 차량을 등록하고 관리합니다.
  </p>

  <section class="card">
    <h2 class="card-title">차량 등록</h2>

    <form id="registerForm">
      <div class="form-group">
        <label for="newPlate" class="form-label">차량번호</label>
        <input
                type="text"
                id="newPlate"
                class="form-input"
                placeholder="예: 12가3456"
                required
        >
      </div>

      <button type="submit" class="primary-btn">
        <i class="bi bi-plus-lg"></i>
        차량 등록
      </button>
    </form>
  </section>

  <section class="card">
    <h2 class="card-title">전체 등록 차량</h2>
    <ul id="vehicleList" class="data-list"></ul>
  </section>

  <div class="button-area">
    <button class="back-btn" onclick="location.href='/dashboard.html'">
      <i class="bi bi-arrow-left"></i>
      대시보드로
    </button>
  </div>
</main>

<script src="/common.js"></script>

<script>
  const token = localStorage.getItem("token");

  if (!token) {
    alert("인증되지 않았습니다. 로그인 페이지로 이동합니다.");
    location.href = "/login.html";
  }

  const list = document.getElementById("vehicleList");
  const form = document.getElementById("registerForm");

  async function loadVehicles() {
    const response = await fetch("/api/vehicle/registered", {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    if (!response.ok) {
      alert("데이터를 불러올 수 없습니다.");
      return;
    }

    const data = await response.json();
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `
                <li class="empty">
                    <i class="bi bi-car-front"></i>
                    등록된 차량이 없습니다.
                </li>
            `;
      return;
    }

    data.forEach(vehicle => {
      const li = document.createElement("li");
      li.className = "data-item";

      li.innerHTML = `
                <div class="vehicle-info">
                    <div class="vehicle-icon">
                        <i class="bi bi-car-front"></i>
                    </div>

                    <div>
                        <div class="vehicle-number">
                            ${vehicle.plateNumber}
                        </div>

                        <div class="vehicle-sub">
                            등록 차량
                        </div>
                    </div>
                </div>

                <button
                    class="delete-btn"
                    onclick="deleteVehicle('${vehicle.plateNumber}')"
                >
                    <i class="bi bi-trash3"></i>
                    삭제
                </button>
            `;

      list.appendChild(li);
    });
  }

  async function deleteVehicle(plateNumber) {
    if (!confirm(`${plateNumber} 차량을 삭제할까요?`)) {
      return;
    }

    const response = await fetch(`/api/vehicle/${plateNumber}`, {
      method: "DELETE",
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    if (response.ok) {
      alert("차량 삭제가 완료되었습니다.");
      loadVehicles();
    } else {
      alert("차량 삭제에 실패했습니다.");
    }
  }

  form.onsubmit = async (e) => {
    e.preventDefault();

    const plate = document.getElementById("newPlate").value.trim();

    if (!plate) {
      alert("차량번호를 입력해주세요.");
      return;
    }

    const payload = {
      plateNumber: plate,
      registered: true
    };

    const response = await fetch("/api/vehicle", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      alert("차량 등록이 완료되었습니다.");
      form.reset();
      loadVehicles();
    } else {
      alert("차량 등록에 실패했습니다.");
    }
  };

  loadVehicles();
</script>
</body>
</html>
