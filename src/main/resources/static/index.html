<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>주차 관리 시스템</title>

</head>

<body>


<script>

  const token =
          localStorage.getItem("token");


  if (token) {

    location.href =
            "/dashboard.html";

  } else {

    location.href =
            "/login.html";

  }

</script>


</body>

</html>
